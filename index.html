<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A tiny browser space shooter game.">
  <title>Cosmic Defender</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="start-screen" class="screen" aria-label="Start screen">
    <div class="stars" aria-hidden="true"></div>
    <section class="start-card">
      <p class="eyebrow">DEEP SPACE // 01</p>
      <h1>Cosmic Defender</h1>
      <p class="hint">Protect your sector from the incoming swarm.</p>
      <button id="play-button" class="primary-button" type="button">Play</button>
    </section>
  </main>

  <canvas id="game-canvas" hidden></canvas>

  <section id="game-over" class="overlay" hidden aria-live="polite">
    <div class="game-over-card">
      <p class="eyebrow">SIGNAL LOST</p>
      <h2>Game Over</h2>
      <p>Your final score: <strong id="final-score">0</strong></p>
      <button id="restart-button" class="primary-button" type="button">Play Again</button>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
